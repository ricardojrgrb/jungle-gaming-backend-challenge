# Balanceador simples para demonstrar as 3 instâncias atrás de uma porta só.
# Em produção isso seria o ALB/ingress; aqui é só round-robin.
events {}
http {
  upstream wagering {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }
  server {
    listen 3000;
    location / {
      proxy_pass http://wagering;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
