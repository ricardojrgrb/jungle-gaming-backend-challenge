x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://localstack:4566
  SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-events.fifo
  SQS_MAX_RECEIVE_COUNT: "5"
  AUTH_MODE: ${AUTH_MODE:-none}

x-app: &app
  build: .
  environment: *app-env
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      SQS_MAX_RECEIVE_COUNT: "5"
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh:ro
    healthcheck:
      # Só fica healthy depois que o init script criou as filas.
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wagering-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: aplica as migrations antes das instâncias subirem. Evita três
  # instâncias disputando a tabela de migrations no boot.
  migrate:
    build: .
    environment: *app-env
    command: ["bun", "run", "migration:up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports: ["3001:3000"]
  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports: ["3002:3000"]
  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports: ["3003:3000"]

  lb:
    image: nginx:1.27-alpine
    ports: ["3000:3000"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3

volumes:
  postgres-data:
